<!doctype html><meta charset="utf-8" /><title>
  One-minute accompaniment test
</title>
<h1>One-minute accompaniment test</h1>
<button id="start">Run test</button>
<pre id="status">
Ready. Original synthesized melody: 60 seconds, 96 BPM, first beat at zero.</pre
>
<audio id="result" controls></audio>
<script type="module">
  import { Band } from '/audio.mjs';
  import { analyseClip, sliceRecording } from '/lookahead.mjs';
  import { joinSustains } from '/sustain.mjs';
  import { wavDataUrl } from '/recording.mjs';
  const status = document.querySelector('#status'),
    trace = { turns: [], playback: {}, errors: [] };
  const save = async (name, blob) => {
    const bytes = new Uint8Array(await blob.arrayBuffer());
    let binary = '';
    for (let i = 0; i < bytes.length; i += 8192)
      binary += String.fromCharCode(...bytes.subarray(i, i + 8192));
    const r = await fetch('/test-artifact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, data: btoa(binary) }),
    });
    if (!r.ok) throw Error('Artifact save failed');
  };
  document.querySelector('#start').onclick = async () => {
    document.querySelector('#start').disabled = true;
    const ctx = new AudioContext(),
      sessionId = crypto.randomUUID();
    await ctx.resume();
    try {
      const rate = ctx.sampleRate,
        buffer = ctx.createBuffer(1, rate * 60, rate),
        x = buffer.getChannelData(0),
        beat = 60 / 96;
      const phrases = [
        [60, 64, 67, 64, 62, 65, 69, 65],
        [57, 60, 64, 60, 55, 59, 62, 59],
        [64, 67, 72, 71, 69, 67, 65, 62],
      ];
      for (let n = 0; n < 96; n++) {
        const note = phrases[Math.floor(n / 32) % 3][n % 8],
          start = n * beat,
          f = 440 * 2 ** ((note - 69) / 12);
        for (
          let i = Math.round(start * rate);
          i < Math.min(x.length, Math.round((start + beat * 0.88) * rate));
          i++
        ) {
          const t = i / rate - start;
          x[i] =
            0.18 *
            Math.min(1, t / 0.01) *
            Math.exp(-3 * t) *
            (Math.sin(2 * Math.PI * f * t) +
              0.22 * Math.sin(4 * Math.PI * f * t));
        }
      }
      await save(
        'test-input.wav',
        await (
          await fetch(wavDataUrl({ channels: [x], sampleRate: rate }))
        ).blob(),
      );
      const band = new Band(ctx);
      band.levels = { ...band.levels, piano: 0.35, bass: 0.35, drums: 0.2 };
      const capture = ctx.createMediaStreamDestination();
      band.master.connect(capture);
      const resp = await fetch('/session/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId }),
      });
      if (!resp.ok) throw Error('Session start failed');
      const notes = [];
      for (let phrase = 0; phrase < 6; phrase++) {
        status.textContent = `Preparing phrase ${phrase + 1}/6. Audio starts after all 60 seconds are ready.`;
        const upcoming = await Promise.all(
          Array.from({ length: 4 }, async (_, index) => ({
            index,
            startSeconds: phrase * 10 + index * 2.5,
            evidence: await analyseClip(
              sliceRecording(buffer, phrase * 10 + index * 2.5, 2.5),
            ),
          })),
        );
        let complete = false;
        for (let attempt = 0; attempt < 2 && !complete; attempt++) {
          const request = {
            sessionId,
            bpm: 96,
            tempoMode: 'manual',
            history: [],
            instruments: ['piano', 'bass', 'drums'],
            phraseIndex: phrase,
            upcoming,
            musicalDirection:
              'Flowing piano counter-melody answering the source, bass only where useful, restrained optional drums. Develop a recognizable phrase; do not compete with the source melody.',
          };
          const turn = { request, events: [] };
          trace.turns.push(turn);
          const r = await fetch('/compose', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(request),
          });
          if (!r.ok) throw Error('Compose HTTP ' + r.status);
          const lines = (await r.text()).trim().split('\n').map(JSON.parse);
          turn.events = lines;
          const error = lines.find((e) => e.type === 'error');
          if (error) {
            trace.errors.push(error.message);
            continue;
          }
          if (!lines.some((e) => e.type === 'done'))
            throw Error('Incomplete generation');
          for (const bar of lines.filter((e) => e.type === 'bar'))
            for (const note of bar.notes)
              notes.push({
                ...note,
                time: phrase * 10 + bar.index * 2.5 + note.beat * beat,
                tempo: 96,
              });
          complete = true;
        }
        await save(
          'test-trace.json',
          new Blob([JSON.stringify(trace, null, 2)]),
        );
        if (!complete)
          throw Error('Phrase failed twice; no substitute music used');
      }
      await band.prepare(notes);
      const joined = joinSustains(notes);
      const recorder = new MediaRecorder(capture.stream);
      const chunks = [];
      recorder.ondataavailable = (e) => chunks.push(e.data);
      const stopped = new Promise((resolve) => (recorder.onstop = resolve));
      recorder.start();
      const source = ctx.createBufferSource();
      source.buffer = buffer;
      source.connect(ctx.destination);
      source.connect(capture);
      const anchor = ctx.currentTime + 0.3;
      for (const n of joined) band.play(n, anchor + n.time, 96);
      source.start(anchor);
      trace.playback = {
        durationSeconds: 60,
        sourceStarts: 1,
        notes: notes.length,
        joinedNotes: joined.length,
        anchor,
      };
      const timer = setInterval(
        () =>
          (status.textContent = `Playing continuously: ${Math.max(0, Math.min(60, ctx.currentTime - anchor)).toFixed(1)} / 60 seconds`),
        250,
      );
      await new Promise((resolve) => (source.onended = resolve));
      await new Promise((resolve) => setTimeout(resolve, 500));
      clearInterval(timer);
      recorder.stop();
      await stopped;
      const blob = new Blob(chunks, { type: recorder.mimeType });
      document.querySelector('#result').src = URL.createObjectURL(blob);
      await save('test-mix.webm', blob);
      await save('test-trace.json', new Blob([JSON.stringify(trace, null, 2)]));
      status.textContent =
        'COMPLETE: 60 seconds continuous source playback. Mix and all requests/responses saved.';
    } catch (e) {
      trace.errors.push(e.message);
      status.textContent = 'FAILED: ' + e.message;
      await save('test-trace.json', new Blob([JSON.stringify(trace, null, 2)]));
    } finally {
      await fetch('/session/stop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId }),
      });
    }
  };
</script>
